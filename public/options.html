<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Media Downloader 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header"><h1>设置</h1></header>
      <div class="settings-layout">
        <nav aria-label="设置分类">
          <button class="nav-item active" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 3.5-2.1-1 .1-2.3-2.2-1.3-2 1.2-1.9-1.2-2 1.2-2-1.2-2.1 1.3.1 2.3-2.1 1v2.5l2.1 1-.1 2.3 2.2 1.3 2-1.2 1.9 1.2 2-1.2 2 1.2 2.1-1.3-.1-2.3 2.1-1V12Z" /></svg>
            常规
          </button>
        </nav>

        <section class="settings-content">
          <div class="setting-group">
            <h2>下载目录</h2>
            <p class="description">下载的图片和视频将直接流式写入这个文件夹。</p>
            <div class="folder-control">
              <svg viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9v10H3v-12Z" /></svg>
              <div><strong id="folder-name">尚未选择文件夹</strong><span id="folder-permission">需要选择并授权目录</span></div>
              <button id="choose-folder" class="primary-button" type="button">选择下载目录</button>
            </div>
          </div>

          <div class="setting-group">
            <h2>并发下载</h2>
            <p class="description">同时下载的任务数量。默认 2，最高 5；网络很快时可以提高。</p>
            <fieldset class="concurrency-picker" aria-label="并发下载数量">
              <legend class="sr-only">并发下载数量</legend>
              <div id="concurrency-options" class="segments"></div>
            </fieldset>
            <p class="hint">高并发会增加 Telegram 页面、磁盘和内存压力，建议逐步调整。</p>
          </div>

          <div class="actions">
            <button id="save-settings" class="primary-button save-button" type="button">保存设置</button>
            <span id="save-status" role="status" aria-live="polite"></span>
          </div>

          <div class="privacy-note">
            <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.6 2.7 8.4 7 10 4.3-1.6 7-5.4 7-10V6l-7-3Zm-3 9 2 2 4-5" /></svg>
            <span>仅在本机处理，不上传任何媒体</span>
          </div>
        </section>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
