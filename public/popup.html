<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>媒体下载器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="app-icon" src="../icons/icon48.png" alt="" />
        <div><h1>媒体下载器</h1><p>Telegram Web</p></div>
      </header>

      <section aria-labelledby="folder-heading">
        <h2 id="folder-heading">下载目录</h2>
        <div class="surface folder-surface">
          <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h7l2 2h9v10H3v-12Z" /></svg>
          <div class="folder-copy">
            <strong id="folder-name">尚未选择文件夹</strong>
            <span id="folder-status">请选择媒体保存位置</span>
          </div>
          <button id="choose-folder" class="compact-button" type="button">选择</button>
        </div>
      </section>

      <section aria-labelledby="concurrency-heading">
        <div class="section-heading">
          <h2 id="concurrency-heading">同时下载</h2>
          <span>默认 2，最多 5</span>
        </div>
        <div id="concurrency-options" class="surface segments" role="group" aria-label="同时下载任务数"></div>
      </section>

      <section aria-labelledby="page-heading">
        <h2 id="page-heading">当前页面</h2>
        <div class="surface stats-row">
          <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6V3Zm9 0v5h4M9 13h7M9 17h5" /></svg>
          <div><strong id="media-count">未连接 Telegram 页面</strong><span id="media-detail">打开 Telegram Web 后自动检索</span></div>
          <span class="live-dot" aria-hidden="true"></span>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
