<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>媒体下载器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="app-icon" src="../icons/icon48.png" alt="" />
        <h1>媒体下载器</h1>
        <button id="open-settings-icon" class="icon-button" type="button" aria-label="打开设置">
          <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 3.5-2.1-1 .1-2.3-2.2-1.3-2 1.2-1.9-1.2-2 1.2-2-1.2-2.1 1.3.1 2.3-2.1 1v2.5l2.1 1-.1 2.3 2.2 1.3 2-1.2 1.9 1.2 2-1.2 2 1.2 2.1-1.3-.1-2.3 2.1-1V12Z" /></svg>
        </button>
      </header>

      <section aria-labelledby="folder-heading">
        <h2 id="folder-heading">下载目录</h2>
        <div class="surface folder-surface">
          <div class="surface-row">
            <svg class="row-icon" viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9v10H3v-12Z" /></svg>
            <div>
              <strong id="folder-name">尚未选择文件夹</strong>
              <span id="folder-status">请选择媒体保存位置</span>
            </div>
          </div>
          <button id="choose-folder" class="primary-button" type="button">选择文件夹</button>
        </div>
      </section>

      <section aria-labelledby="concurrency-heading">
        <h2 id="concurrency-heading">并发下载</h2>
        <button id="open-settings-concurrency" class="surface concurrency-row" type="button">
          <svg class="speed-icon" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0M12 17l4-6" /></svg>
          <span><strong id="concurrency-value">2 个任务</strong><small>同时下载的任务数量，最高 5</small></span>
          <svg class="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg>
        </button>
      </section>

      <section aria-labelledby="page-heading">
        <h2 id="page-heading">当前页面</h2>
        <div class="surface stats-row">
          <svg class="row-icon" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6V3Zm9 0v5h4M9 13h7M9 17h5" /></svg>
          <div><strong id="media-count">未连接 Telegram 页面</strong><span id="media-detail">打开 Telegram Web 后自动检索</span></div>
        </div>
      </section>

      <button id="open-settings" class="secondary-button" type="button">打开设置</button>

      <section class="help" aria-labelledby="help-heading">
        <h2 id="help-heading">使用方式</h2>
        <p>每个媒体附件右下角显示单独下载按钮；多媒体消息末尾显示批量下载按钮。</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
